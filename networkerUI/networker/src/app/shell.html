<header class="sticky top-0 z-20 border-b border-line bg-paper/90 backdrop-blur">
  <div class="mx-auto flex h-16 max-w-6xl items-center gap-6 px-4 sm:px-6">
    <!-- Plain href (not routerLink) so the logo does a full reload back to home. -->
    <a href="/" class="flex items-center gap-2" title="Reload and go home">
      <img src="logo.png" alt="Networker" class="h-8 w-auto" />
      <span class="hand hidden text-base sm:inline">people first</span>
    </a>

    <nav class="flex items-center gap-1 text-sm">
      @for (item of nav; track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive="squiggle !text-ink"
          [routerLinkActiveOptions]="{ exact: item.exact }"
          class="px-2.5 py-1 font-medium text-ink-2 transition-colors hover:text-ink"
          >{{ item.label }}</a
        >
      }
    </nav>

    @if (session.me()) {
      <app-notification-bell class="-mr-3 ml-auto" />
    }

    <div class="relative" [class.ml-auto]="!session.me()">
      @if (session.me(); as me) {
        <button
          class="flex items-center gap-2 rounded-full py-1 pl-1 pr-3 transition-colors hover:bg-sunken"
          (click)="menuOpen.set(!menuOpen())"
          aria-haspopup="menu"
          [attr.aria-expanded]="menuOpen()"
        >
          <app-avatar [name]="me.name" [src]="me.pictureUrl" size="sm" />
          <span class="hidden text-sm font-medium sm:inline">{{ me.name }}</span>
        </button>
        @if (menuOpen()) {
          <div class="fixed inset-0 z-10" (click)="menuOpen.set(false)"></div>
          <div class="card absolute right-0 z-20 mt-2 w-48 p-1.5" role="menu">
            <a routerLink="/profile" (click)="menuOpen.set(false)" class="block rounded-lg px-3 py-2 text-sm hover:bg-sunken" role="menuitem"
              >Edit your profile</a
            >
            <button (click)="session.logout()" class="block w-full rounded-lg px-3 py-2 text-left text-sm hover:bg-sunken" role="menuitem">
              Sign out
            </button>
          </div>
        }
      }
    </div>
  </div>
</header>

<main class="mx-auto max-w-6xl px-4 pb-20 pt-8 sm:px-6">
  @if (session.error(); as error) {
    <div class="card mb-6 border-clay/40 bg-clay-soft/50 px-4 py-3 text-sm text-ink">{{ error }}</div>
  }
  <router-outlet />
</main>
