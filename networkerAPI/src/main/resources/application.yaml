spring:
  application:
    name: networker
  config:
    import:
        - optional:classpath:secrets.yaml
  datasource:
    url: jdbc:postgresql://${datasource.host}:25060/networks?sslmode=require
    username: ${datasource.username}
    password: ${datasource.password}
    hikari:
      maximum-pool-size: 5
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      # Resumes are capped at 5 MB in ResumeService; this leaves room for the rest of the request.
      max-file-size: 6MB
      max-request-size: 6MB
  jpa:
    hibernate:
      # Flyway owns the schema (src/main/resources/db/migration); Hibernate only checks it matches the entities.
      ddl-auto: validate
    open-in-view: false
  security:
    oauth2:
      resourceserver:
        jwt:
          # Auth0 tenant domain, e.g. https://dev-abc123.us.auth0.com/ (trailing slash required)
          issuer-uri: ${AUTH0_ISSUER:https://dev-meac52y4dgsxm7hb.us.auth0.com/}
          # Identifier of the Auth0 API you created for this backend
          audiences: ${AUTH0_AUDIENCE:https://networker-api}

app:
  cors-origins: ${CORS_ORIGINS:http://localhost:4200}
  # Seeds a handful of sample people, two of whom send each new user a connection
  # request, so a brand-new install has someone to connect with. Turn off for real use.
  demo-data: ${DEMO_DATA:true}
